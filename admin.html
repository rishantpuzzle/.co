<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,Helvetica,sans-serif;
}

body{
    background:#f6f3ee;
    color:#30261b;
}

header{
    background:#fff;
    border-bottom:1px solid #e5ddd1;
    position:sticky;
    top:0;
    z-index:1000;
}

.nav{
    max-width:1150px;

    padding:14px 20px;
    display:flex;
    align-items:center;

}

.brand{

}

.logo{

}

.brand h1{
    font-size:20px;

}

.brand small{
    color:#8b7354;
    font-size:12px;
}

.user-area{
    display:flex;
    align-items:center;
    gap:10px;
}

.user-photo{
    width:40px;
    height:40px;
    border-radius:50%;
    object-fit:cover;
    border:2px solid #e3d4bf;
}

.user-name{
    font-size:14px;

}

button{

}

.hidden{

}

.login-btn,

.login-btn{

}

.logout{
    background:#5b3510;
    color:#fff;
}

.login-screen{
    min-height:calc(100vh - 79px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:25px;
}

.login-card{
    width:100%;
    max-width:430px;
    background:#fff;
    border:1px solid #e5ddd1;

}

.temple-icon{

    height:80px;

    background:#9a600e;

.login-card h2{

.hero{

}

}

.card{

}

.controls{

}

select{
    padding:11px 13px;

    border-radius:9px;
    background:#fff;
    color:#30261b;
}

.request{
    background:#fffaf2;
    border:1px solid #eadfcf;
    border-radius:15px;
    padding:20px;
    margin-top:15px;
}

.request-top{
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
    flex-wrap:wrap;
    margin-bottom:12px;
}

.request-name{
    font-size:18px;
    font-weight:bold;
    color:#51300d;
}

.badge{
    padding:6px 12px;
    border-radius:20px;

    font-weight:bold;
    background:#fff0c9;
    color:#8a5a00;
}

.badge.approved{

.badge.rejected{

.details{

}

}

.assign-title{

    margin-bottom:10px;
}

.assign-row{
    display:flex;
    gap:10px;
    flex-wrap:wrap;
}

.room-input{
    flex:1;
    min-width:160px;
    padding:11px 12px;
    border:1px solid #d9cbb8;

}

.room-input:focus{
    border-color:#a96812;
}

.assign-btn{
    border:none;
    border-radius:8px;
    padding:11px 16px;

}

.assign-btn:hover{
    background:#754407;
}

.assign-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
}

.reject-btn{
    border:none;
    border-radius:8px;
    padding:11px 16px;
    background:#b91c1c;
    color:#fff;
    font-weight:bold;
}

.pending-btn{
    border:none;
    border-radius:8px;
    padding:11px 16px;
    background:#6b4a22;
    color:#fff;
    font-weight:bold;
}

.delete-btn{
    border:none;
    border-radius:8px;
    padding:11px 16px;
    background:#991b1b;
    color:#fff;
    font-weight:bold;
}

.admin-actions{
    margin-top:12px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
}

.room-display{
    margin-top:10px;
    padding:10px;
    background:#e8f7ed;
    color:#166534;
    border-radius:8px;
    font-size:14px;
    font-weight:bold;
}

.empty{
    color:#8a7964;
    padding:25px 0;
    text-align:center;
    font-size:14px;
}

.message{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    font-size:13px;
    line-height:1.5;
}

.message.success{
    display:block;
    background:#e8f7ed;
    color:#166534;
}

.message.error{
    display:block;
    background:#feecec;
    color:#991b1b;
}

footer{
    text-align:center;
    padding:25px;
    color:#9b8970;
    font-size:13px;
}

@media(max-width:700px){

    .container{
        padding:20px 13px 45px;
    }

    .hero{
        padding:27px 20px;
    }

    .hero h2{
        font-size:26px;
    }

    .card{
        padding:18px;
    }

    .details{
        grid-template-columns:1fr;
    }

    .user-name{
        display:none;
    }

    .brand h1{
        font-size:16px;
    }

    .brand small{
        font-size:10px;
    }

        padding:10px 13px;
    }

}

</style>

<header>

<div class="nav">

        >

<!-- LOGIN -->

<section id="loginScreen" class="login-screen">

<div class="login-card">

    <div class="temple-icon">
        MM
    </div>

    <h2>Munger Mandir Admin</h2>

    <p>
        Login with the authorized Google account
        to manage room requests.
    </p>

    </button>

    <div class="controls">

        <select id="adminFilter">

            <option value="all">
                All Requests

<script type="module">

/* =====================================================
   FIREBASE IMPORT
===================================================== */

import {
    initializeApp
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-app.js";


import {
    getAuth,
    GoogleAuthProvider,
    signInWithPopup,
    signOut,
    onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-auth.js";


import {
    getDatabase,
    ref,
    update,
    remove,
    onValue
}
from "https://www.gstatic.com/firebasejs/12.18.0/firebase-database.js";


/* =====================================================
   FIREBASE CONFIG
===================================================== */

const firebaseConfig = {

    apiKey:
    "AIzaSyD7qJWxjijDXrdTiI7D14zR-ds-j46rNzc",

    authDomain:
    "munger-mandir-room-request.firebaseapp.com",

    projectId:
    "munger-mandir-room-request",

    storageBucket:
    "munger-mandir-room-request.firebasestorage.app",

    messagingSenderId:
    "145384185034",

    appId:
    "1:145384185034:web:c828c0388f8bd79d79a833",

    measurementId:
    "G-LF2K2KFCN6",

    databaseURL:
    "https://munger-mandir-room-request-default-rtdb.firebaseio.com"

};


/* =====================================================
   INITIALIZE
===================================================== */

const app =
initializeApp(firebaseConfig);

const auth =
getAuth(app);

const db =
getDatabase(app);

const provider =
new GoogleAuthProvider();


/* =====================================================
   EMAILJS - ROOM CONFIRMATION
===================================================== */

const EMAILJS_PUBLIC_KEY =
"QfXRTgJSSkBcv72T7";

const EMAILJS_SERVICE_ID =
"1234567890";

const EMAILJS_TEMPLATE_ID =
"template_kq9x50d";


emailjs.init({
    publicKey: EMAILJS_PUBLIC_KEY
});


/* =====================================================
   ADMIN EMAIL
===================================================== */

const ADMIN_EMAIL =
"rishantbhaumik@gmail.com";


/* =====================================================
   ELEMENTS
===================================================== */

const loginScreen =
document.getElementById("loginScreen");

const mainApp =
document.getElementById("mainApp");

const userArea =
document.getElementById("userArea");

const topLogin =
document.getElementById("topLogin");

const googleBtn =
document.getElementById("googleBtn");

const logoutBtn =
document.getElementById("logoutBtn");

const userName =
document.getElementById("userName");

const userPhoto =
document.getElementById("userPhoto");

const loginMessage =
document.getElementById("loginMessage");

const allRequests =
document.getElementById("allRequests");

const adminFilter =
document.getElementById("adminFilter");

const globalMessage =
document.getElementById("globalMessage");


let databaseUnsubscribe = null;


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(element,text,type=""){

    element.textContent = text;

    element.className =
        "message " + type;

    element.style.display =
        "block";

}


function hideMessage(element){

    element.style.display =
        "none";

}


/* =====================================================
   GOOGLE LOGIN
===================================================== */

async function login(){

    googleBtn.disabled = true;
    topLogin.disabled = true;

    showMessage(
        loginMessage,
        "Opening Google Login..."
    );

    try{

        await signInWithPopup(
            auth,
            provider
        );

        hideMessage(loginMessage);

    }

    catch(error){

        console.error(
            "LOGIN ERROR:",
            error
        );

        showMessage(
            loginMessage,
            getFirebaseError(error),
            "error"
        );

    }

    finally{

        googleBtn.disabled = false;
        topLogin.disabled = false;

    }

}


googleBtn.addEventListener(
    "click",
    login
);


topLogin.addEventListener(
    "click",
    login
);


/* =====================================================
   LOGOUT
===================================================== */

logoutBtn.addEventListener(
    "click",
    async()=>{

        try{

            await signOut(auth);

        }

        catch(error){

            console.error(error);

        }

    }
);


/* =====================================================
   AUTH STATE
===================================================== */

onAuthStateChanged(
    auth,
    user=>{

        if(!user){

            stopDatabaseListener();

            loginScreen.classList.remove(
                "hidden"
            );

            mainApp.classList.add(
                "hidden"
            );

            userArea.classList.add(
                "hidden"
            );

            topLogin.classList.remove(
                "hidden"
            );

            return;

        }


        /* ADMIN CHECK */

        if(
            !user.email ||
            user.email.toLowerCase() !==
            ADMIN_EMAIL.toLowerCase()
        ){

            showMessage(
                loginMessage,
                "Access denied. This Google account is not authorized as admin.",
                "error"
            );

            signOut(auth);

            return;

        }


        loginScreen.classList.add(
            "hidden"
        );

        mainApp.classList.remove(
            "hidden"
        );

        userArea.classList.remove(
            "hidden"
        );

        topLogin.classList.add(
            "hidden"
        );


        userName.textContent =
            user.displayName ||
            "Admin";


        userPhoto.src =
            user.photoURL ||
            "https://via.placeholder.com/100";


        loadAllRequests();

    }
);


/* =====================================================
   LOAD ALL REQUESTS
===================================================== */

function loadAllRequests(){

    stopDatabaseListener();


    const requestsRef =
        ref(
            db,
            "roomRequests"
        );


    databaseUnsubscribe =
        onValue(

            requestsRef,

            snapshot=>{

                renderRequests(snapshot);

            },

            error=>{

                console.error(
                    "DATABASE ERROR:",
                    error
                );

                allRequests.innerHTML =
                    '<div class="empty">' +
                    escapeHTML(
                        getFirebaseError(error)
                    ) +
                    '</div>';

            }

        );

}


/* =====================================================
   STOP DATABASE LISTENER
===================================================== */

function stopDatabaseListener(){

    if(databaseUnsubscribe){

        databaseUnsubscribe();

        databaseUnsubscribe =
            null;

    }

}


/* =====================================================
   RENDER REQUESTS
===================================================== */

function renderRequests(snapshot){

    allRequests.innerHTML = "";

    const requests = [];


    snapshot.forEach(
        item=>{

            requests.push({

                id:
                item.key,

                data:
                item.val()

            });

        }
    );


    requests.sort(
        (a,b)=>{

            return Number(
                b.data.createdAt || 0
            )
            -
            Number(
                a.data.createdAt || 0
            );

        }
    );


    const filter =
        adminFilter.value;


    let count = 0;


    requests.forEach(
        item=>{

            const status =
                item.data.status ||
                "pending";


            if(
                filter !== "all" &&
                filter !== status
            ){

                return;

            }


            count++;


            allRequests.appendChild(

                createRequestCard(
                    item.id,
                    item.data
                )

            );

        }
    );


    if(count === 0){

        allRequests.innerHTML =
            '<div class="empty">' +
            'No requests found.' +
            '</div>';

    }

}


/* =====================================================
   CREATE REQUEST CARD
===================================================== */

function createRequestCard(id,data){

    const div =
        document.createElement("div");

    div.className =
        "request";


    const status =
        data.status ||
        "pending";


    const statusText =
        status.charAt(0).toUpperCase() +
        status.slice(1);


    const roomNumber =
        data.roomNo ||
        data.roomNumber ||
        "";


    div.innerHTML = `

        <div class="request-top">

            <div class="request-name">
                ${escapeHTML(
                    (data.firstName || "") +
                    " " +
                    (data.lastName || "")
                )}
            </div>

            <span class="badge ${escapeHTML(status)}">
                ${escapeHTML(statusText)}
            </span>

        </div>


        <div class="details">

            <div class="detail">
                <b>Email:</b>
                ${escapeHTML(
                    data.email ||
                    data.userEmail ||
                    ""
                )}
            </div>

            <div class="detail">
                <b>Phone:</b>
                ${escapeHTML(
                    data.phone || ""
                )}
            </div>

            <div class="detail">
                <b>Check-in:</b>
                ${escapeHTML(
                    data.checkIn || ""
                )}
            </div>

            <div class="detail">
                <b>Check-out:</b>
                ${escapeHTML(
                    data.checkOut || ""
                )}
            </div>

            <div class="detail">
                <b>Passport:</b>
                ${escapeHTML(
                    data.passport || ""
                )}
            </div>

            <div class="detail">
                <b>Beds:</b>
                ${escapeHTML(
                    data.beds || 0
                )}
            </div>

            <div class="detail">
                <b>AC Room:</b>
                ${escapeHTML(
                    data.acRoom || ""
                )}
            </div>

            <div class="detail">
                <b>Hot Water:</b>
                ${escapeHTML(
                    data.hotWater || ""
                )}
            </div>

            <div class="detail">
                <b>Utensils:</b>
                ${escapeHTML(
                    data.utensils || ""
                )}
            </div>

            <div class="detail">
                <b>Water Jugs:</b>
                ${escapeHTML(
                    data.waterJugs || 0
                )}
            </div>

            <div class="detail">
                <b>Mosquito Dispeller:</b>
                ${escapeHTML(
                    data.mosquito || ""
                )}
            </div>

            <div class="detail">
                <b>Total Extra:</b>
                ₹${escapeHTML(
                    data.totalExtra || 0
                )}
            </div>

        </div>


        ${
            roomNumber
            ?
            `
            <div class="room-display">
                🏠 Assigned Room: ${escapeHTML(roomNumber)}
            </div>
            `
            :
            ""
        }


        <div class="assign-box">

            <div class="assign-title">
                🏠 Assign Room
            </div>

            <div class="assign-row">

                <input
                    class="room-input"
                    id="room-${id}"
                    type="text"
                    placeholder="Enter room number"
                    value="${escapeHTML(roomNumber)}"
                >

                <button
                    class="assign-btn"
                    data-id="${id}"
                >
                    Assign Room
                </button>

            </div>

        </div>


        <div class="admin-actions">

            <button
                class="pending-btn"
                data-action="pending"
                data-id="${id}"
            >
                Pending
            </button>

            <button
                class="assign-btn"
                data-action="approved"
                data-id="${id}"
            >
                Approve
            </button>

            <button
                class="reject-btn"
                data-action="rejected"
                data-id="${id}"
            >
                Reject
            </button>

            <button
                class="delete-btn"
                data-delete="${id}"
            >
                Delete
            </button>

        </div>

    `;


    /* =================================================
       ASSIGN ROOM
    ================================================= */

    const assignButton =
        div.querySelector(
            ".assign-btn"
        );


    assignButton.addEventListener(
        "click",
        async()=>{

            const roomInput =
                div.querySelector(
                    ".room-input"
                );


            const roomNo =
                roomInput.value.trim();


            if(!roomNo){

                showMessage(
                    globalMessage,
                    "Please enter a room number.",
                    "error"
                );

                return;

            }


            assignButton.disabled =
                true;

            assignButton.textContent =
                "Assigning...";


            try{

                const requestRef =
                    ref(
                        db,
                        "roomRequests/" +
                        id
                    );


                /*
                   UPDATE DATABASE
                */

                await update(
                    requestRef,
                    {

                        status:
                        "approved",

                        roomNo:
                        roomNo,

                        roomAssignedAt:
                        Date.now()

                    }
                );


                /*
                   SEND CONFIRMATION EMAIL
                */

                const email =
                    data.email ||
                    data.userEmail ||
                    "";


                if(!email){

                    throw new Error(
                        "Guest email not found."
                    );

                }


                let emailSent =
                    false;


                try{

                    await sendRoomConfirmationEmail(
                        data,
                        roomNo,
                        id
                    );

                    emailSent =
                        true;

                }

                catch(emailError){

                    console.error(
                        "EMAILJS ERROR:",
                        emailError
                    );

                }


                if(emailSent){

                    showMessage(
                        globalMessage,
                        "Room " +
                        roomNo +
                        " assigned successfully. Confirmation email sent to " +
                        email +
                        ".",
                        "success"
                    );

                }
                else{

                    showMessage(
                        globalMessage,
                        "Room " +
                        roomNo +
                        " assigned successfully, but confirmation email could not be sent. Check EmailJS Service ID, Template ID and template variables.",
                        "error"
                    );

                }

            }

            catch(error){

                console.error(
                    "ASSIGN ERROR:",
                    error
                );

                showMessage(
                    globalMessage,
                    "Room assignment failed: " +
                    getFirebaseError(error),
                    "error"
                );

            }

            finally{

                assignButton.disabled =
                    false;

                assignButton.textContent =
                    "Assign Room";

            }

        }
    );


    /* =================================================
       STATUS BUTTONS
    ================================================= */

    div
    .querySelectorAll(
        "[data-action]"
    )
    .forEach(
        button=>{

            button.addEventListener(
                "click",
                async()=>{

                    const newStatus =
                        button.dataset.action;


                    try{

                        button.disabled =
                            true;


                        await update(

                            ref(
                                db,
                                "roomRequests/" +
                                id
                            ),

                            {

                                status:
                                newStatus

                            }

                        );


                        showMessage(
                            globalMessage,
                            "Request status changed to " +
                            newStatus + ".",
                            "success"
                        );

                    }

                    catch(error){

                        console.error(error);

                        showMessage(
                            globalMessage,
                            "Status update failed: " +
                            getFirebaseError(error),
                            "error"
                        );

                    }

                    finally{

                        button.disabled =
                            false;

                    }

                }
            );

        }
    );


    /* =================================================
       DELETE
    ================================================= */

    const deleteButton =
        div.querySelector(
            "[data-delete]"
        );


    deleteButton.addEventListener(
        "click",
        async()=>{

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this request?"
                );


            if(!confirmDelete){

                return;

            }


            try{

                deleteButton.disabled =
                    true;


                await remove(

                    ref(
                        db,
                        "roomRequests/" +
                        id
                    )

                );


                showMessage(
                    globalMessage,
                    "Request deleted successfully.",
                    "success"
                );

            }

            catch(error){

                console.error(error);

                showMessage(
                    globalMessage,
                    "Delete failed: " +
                    getFirebaseError(error),
                    "error"
                );

                deleteButton.disabled =
                    false;

            }

        }
    );


    return div;

}

adminFilter.addEventListener(
    "change",
    ()=>{

        const user =
            auth.currentUser;


        if(
            user &&
            user.email &&
            user.email.toLowerCase() ===
            ADMIN_EMAIL.toLowerCase()
        ){

            /*
               onValue automatically
               keeps database listener active.
               We don't need another Firebase request.
            */

            const currentRef =
                ref(
                    db,
                    "roomRequests"
                );


            onValue(
                currentRef,
                snapshot=>{
                    renderRequests(snapshot);
                },
                {
                    onlyOnce:true
                }
            );

        }

    }
);


/* =====================================================
   FIREBASE ERROR
===================================================== */

function getFirebaseError(error){

    if(!error){

        return "Unknown error.";

    }


    if(
        error.code ===
        "PERMISSION_DENIED"
    ){

        return "Realtime Database permission denied. Firebase Realtime Database Rules check karo.";

    }


    if(
        error.code ===
        "permission-denied"
    ){

        return "Realtime Database permission denied. Firebase Realtime Database Rules check karo.";

    }


    if(
        error.code ===
        "auth/popup-blocked"
    ){

        return "Google login popup blocked hai. Browser mein popup allow karo.";

    }


    if(
        error.code ===
        "auth/popup-closed-by-user"
    ){

        return "Google login window close kar di gayi.";

    }


    if(
        error.code ===
        "auth/unauthorized-domain"
    ){

        return "Ye website Firebase Authentication mein authorized domain nahi hai.";

    }


    if(
        error.code ===
        "auth/operation-not-allowed"
    ){

        return "Firebase Console mein Google Sign-In enable karo.";

    }


    if(
        error.message
    ){

        return error.message;

    }


    return "Something went wrong.";

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value){

    return String(value ?? "")

        .replaceAll(
            "&",
            "&amp;"
        )

        .replaceAll(
            "<",
            "&lt;"
        )

        .replaceAll(
            ">",
            "&gt;"
        )

        .replaceAll(
            '"',
            "&quot;"
        )

        .replaceAll(
            "'",
            "&#039;"
        );

}
